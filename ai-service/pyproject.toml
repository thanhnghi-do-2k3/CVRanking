[project]
name = "talentrank-ai"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
description = "Schema-validated document intelligence and ranking pipeline"

[project.optional-dependencies]
ml = [
  "torch>=2.7,<3",
  "transformers>=4.53,<5",
  "sentence-transformers>=5,<6",
  "lightgbm>=4.6,<5",
  "scikit-learn>=1.7,<2",
  "mlflow>=3.1,<4",
  "pymupdf>=1.26,<2",
  "python-docx>=1.2,<2",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

