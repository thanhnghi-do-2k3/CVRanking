name: talentrank

x-backend-environment: &backend-environment
  APP_ENV: development
  APP_VERSION: 0.1.0
  LOG_LEVEL: info
  DATABASE_URL: postgres://${POSTGRES_USER:-talentrank}:${POSTGRES_PASSWORD:-talentrank_dev}@postgres:5432/${POSTGRES_DB:-talentrank}?sslmode=disable
  REDIS_URL: redis://redis:6379/0
  JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:-development-only-signing-key-change-me-2026}
  PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-http://localhost:3000}
  REFRESH_COOKIE_SECURE: ${REFRESH_COOKIE_SECURE:-false}
  SMTP_HOST: mailpit
  SMTP_PORT: 1025
  SMTP_FROM: ${SMTP_FROM:-TalentRank <no-reply@talentrank.local>}
  SMTP_TLS: "false"
  AI_BASE_URL: http://ai-service:8000
  OBJECT_STORAGE_ENDPOINT: http://minio:9000
  OBJECT_STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:-talentrank}
  OBJECT_STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-talentrank_dev_password}
  OBJECT_STORAGE_BUCKET: ${MINIO_BUCKET:-resumes}
  OTEL_SERVICE_VERSION: 0.1.0
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-talentrank}
      POSTGRES_USER: ${POSTGRES_USER:-talentrank}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-talentrank_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-talentrank}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-talentrank_dev_password}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  create-bucket:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-talentrank}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-talentrank_dev_password}
      MINIO_BUCKET: ${MINIO_BUCKET:-resumes}
    entrypoint:
      - /bin/sh
      - -c
      - >
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" &&
        mc mb --ignore-existing "local/$${MINIO_BUCKET}" &&
        mc anonymous set none "local/$${MINIO_BUCKET}"
    restart: "no"

  migrate:
    build:
      context: ./backend
      target: runtime
    environment:
      <<: *backend-environment
      MIGRATION_COMMAND: up
    command: ["/app/migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ./backend
      target: runtime
    environment:
      <<: *backend-environment
      HTTP_ADDR: :8080
      SERVICE_NAME: talentrank-api
    command: ["/app/api"]
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      ai-service:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/api/v1/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  worker:
    build:
      context: ./backend
      target: runtime
    environment:
      <<: *backend-environment
      HTTP_ADDR: :8081
      SERVICE_NAME: talentrank-worker
    command: ["/app/worker"]
    ports:
      - "${WORKER_HEALTH_PORT:-8081}:8081"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8081/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  ai-service:
    build:
      context: ./ai-service
    environment:
      APP_ENV: development
      APP_VERSION: 0.1.0
      LOG_LEVEL: INFO
      OTEL_SERVICE_NAME: talentrank-ai
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    ports:
      - "${AI_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_INTERNAL_URL: http://api:8080
    environment:
      BACKEND_INTERNAL_URL: http://api:8080
      AI_INTERNAL_URL: http://ai-service:8000
      GEMINI_API_KEYS: ${GEMINI_API_KEYS:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash}
      AI_RANKING_CANDIDATE_LIMIT: ${AI_RANKING_CANDIDATE_LIMIT:-25}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
      NEXT_TELEMETRY_DISABLED: "1"
      RANKING_DEMO_DATA_DIR: /app/.data
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./frontend/.data:/app/.data
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:3000"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.1.0
    command:
      - mlflow
      - server
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --backend-store-uri
      - sqlite:////mlflow/mlflow.db
      - --default-artifact-root
      - /mlflow/artifacts
    ports:
      - "${MLFLOW_PORT:-5001}:5000"
    volumes:
      - mlflow-data:/mlflow
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.123.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./infra/otel/collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  minio-data:
  mlflow-data:
